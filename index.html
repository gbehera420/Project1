<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A polished Hello World page" />
    <title>Hello, World!</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f8fbff;
        background:
          radial-gradient(circle at 15% 20%, rgba(83, 124, 255, .35), transparent 30rem),
          radial-gradient(circle at 85% 75%, rgba(184, 92, 255, .30), transparent 28rem),
          #07111f;
      }

      .orb {
        position: fixed;
        width: 22rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(2px);
        opacity: .55;
        animation: drift 11s ease-in-out infinite alternate;
      }

      .orb.one { top: -8rem; right: -5rem; background: #14d8c4; }
      .orb.two { bottom: -10rem; left: -6rem; background: #7558ff; animation-delay: -5s; }

      main {
        width: min(90%, 48rem);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, .18);
        border-radius: 2rem;
        background: rgba(11, 25, 45, .64);
        box-shadow: 0 2rem 5rem rgba(0, 0, 0, .35);
        backdrop-filter: blur(18px);
        animation: rise .8s cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #70f5df;
        font-size: .78rem;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 10vw, 6.5rem);
        line-height: .95;
        letter-spacing: -.07em;
        background: linear-gradient(135deg, #ffffff 10%, #92f7e6 50%, #a5a0ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 35rem;
        margin: 1.6rem auto 0;
        color: #c5d3e8;
        font-size: clamp(1rem, 2.2vw, 1.2rem);
        line-height: 1.7;
      }

      .sparkle {
        display: inline-grid;
        place-items: center;
        width: 2.25rem;
        height: 2.25rem;
        margin-bottom: 1.5rem;
        border-radius: .75rem;
        background: linear-gradient(135deg, #27dec9, #7665ff);
        box-shadow: 0 .5rem 1.5rem rgba(42, 219, 201, .28);
        font-size: 1.2rem;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(1.5rem) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(2rem, 1rem) scale(1.12); }
      }
    </style>
  </head>
  <body>
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>
    <main>
      <div class="sparkle" aria-hidden="true">✦</div>
      <p class="eyebrow">A fresh beginning</p>
      <h1>Hello, World!</h1>
      <p>One small page, a whole world of possibilities. Make something wonderful.</p>
    </main>
  </body>
</html>
